name: CD

# main 에 push(= PR 머지) 되면 이미지 빌드 → Docker Hub push → EC2 배포
on:
  push:
    branches: [main]
  workflow_dispatch:        # Actions 탭에서 수동 실행도 허용 (첫 배포 테스트용)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/plog-be:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/plog-be:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: docker-compose.yml 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: ~/plog-app

      - name: EC2 배포
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/plog-app

            # 시크릿으로 .env 생성 (compose 가 이미지 태그·DB·JWT·메일·초대·S3 설정을 여기서 읽음)
            # 시크릿으로 받는 값들은 기본값이 없어 누락 시 앱이 기동조차 못 한다 (fail-fast).
            # S3 자격증명은 EC2 인스턴스 역할에서 오므로 키를 .env 에 두지 않는다.
            # S3_REGION 은 코드 기본값(ap-northeast-2), S3_ENDPOINT 는 MinIO 등 로컬 전용이라 생략.
            #
            # 썸네일(THUMBNAIL_*)도 비밀값이 아니라 S3_* 처럼 여기 하드코딩한다.
            # Lambda 호출 권한 역시 EC2 인스턴스 역할(lambda:InvokeFunction)에서 온다.
            # 끄려면 THUMBNAIL_ENABLED=false 로 바꿔 재배포한다 — EC2 의 .env 를 직접 고치면
            # 다음 배포에 이 블록이 덮어써서 되돌아온다.
            #
            # 소셜 로그인(카카오/구글) 값들:
            #  - GOOGLE_* 는 프로젝트 연동(Drive)용이고 SOCIAL_GOOGLE_* 는 로그인용이다. 서로 다른
            #    OAuth 클라이언트라 이름을 분리했다 — 한쪽 값을 다른 쪽에 넣으면 조용히 인증만 실패한다.
            #  - REDIRECT_URI 는 프론트 콜백 주소이며 비밀값이 아니다. 프론트가 인가 요청에 싣는 값과
            #    문자 단위로 같아야 한다(다르면 카카오 KOE006 / 구글 redirect_uri_mismatch).
            #
            # 외부 연동(integration) 값들:
            #  - GitHub Actions 는 GITHUB_ 로 시작하는 시크릿 이름을 금지한다(예약 접두사).
            #    그래서 시크릿은 GH_* 로 만들고 앱이 읽는 GITHUB_* 환경변수로 여기서 매핑한다.
            #  - URL 들은 비밀값이 아니라 시크릿이 없으면 배포 도메인 기본값을 쓴다.
            #    (빈 값으로 넣으면 application.yaml 의 기본값을 빈 문자열로 덮어써 리다이렉트가 깨진다)
            #  - 리다이렉트(성공/실패) 목적지는 프론트 주소다. 프론트 배포 전이라 로컬 프론트가 기본값이고,
            #    배포되면 INTEGRATION_*_REDIRECT_URL 시크릿만 추가하면 된다.
            #
            # FCM:
            #  - Firebase 서비스 계정 JSON은 이미지나 .env에 넣지 않고 GitHub Secret의 base64 값을
            #    EC2 전용 파일로 복원한 뒤 컨테이너에 read-only로 마운트한다.
            #  - 다음 배포가 파일을 교체하므로 EC2에서 직접 수정하지 않는다.
            #
            # 리포트 LLM(Gemini):
            #  - Gemini Developer API(AI Studio) 키 하나로 호출한다. Vertex AI가 아니므로
            #    GCP 서비스 계정·IAM은 필요 없다.
            #  - 위 GOOGLE_APPLICATION_CREDENTIALS(Firebase용 ADC)를 이 호출에 쓰면 안 된다.
            #    그래서 Google GenAI SDK 대신 RestClient + API 키 헤더로 직접 호출한다
            #    (SDK를 쓰면 ADC를 자동으로 집어가 Firebase 계정으로 인증을 시도한다).
            #  - GEMINI_API_KEY 가 비면 앱은 죽지 않고 StubLlmClient 로 폴백한다 → 필수 검증이
            #    아니라 아래 optional 경고 루프에 둔다. 리포트 텍스트만 더미가 된다.
            #  - GEMINI_MODEL 은 비밀값이 아니라 여기 직접 적는다. 모델 교체는 이 한 줄만 바꾸면 된다.
            cat > .env <<'EOF'
            DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/plog-be:latest
            DB_URL=${{ secrets.DB_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            INVITE_TOKEN_ENCRYPTION_KEY_BASE64=${{ secrets.INVITE_TOKEN_ENCRYPTION_KEY_BASE64 }}
            INVITE_BASE_URL=${{ secrets.INVITE_BASE_URL }}
            S3_ENABLED=true
            S3_BUCKET=umc-plog-prod
            THUMBNAIL_ENABLED=true
            THUMBNAIL_FUNCTION_NAME=plog-thumbnail
            INTEGRATION_CREDENTIAL_ENCRYPTION_KEY_BASE64=${{ secrets.INTEGRATION_CREDENTIAL_ENCRYPTION_KEY_BASE64 }}
            INTEGRATION_SUCCESS_REDIRECT_URL=${{ secrets.INTEGRATION_SUCCESS_REDIRECT_URL || 'http://localhost:5173/integrations/callback' }}
            INTEGRATION_FAILURE_REDIRECT_URL=${{ secrets.INTEGRATION_FAILURE_REDIRECT_URL || 'http://localhost:5173/integrations/callback' }}
            GITHUB_APP_ID=${{ secrets.GH_APP_ID }}
            GITHUB_APP_SLUG=${{ secrets.GH_APP_SLUG }}
            GITHUB_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}
            GITHUB_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}
            GITHUB_APP_PRIVATE_KEY_BASE64=${{ secrets.GH_APP_PRIVATE_KEY_BASE64 }}
            GITHUB_CALLBACK_URL=${{ secrets.GH_CALLBACK_URL }}
            FIGMA_CLIENT_ID=${{ secrets.FIGMA_CLIENT_ID }}
            FIGMA_CLIENT_SECRET=${{ secrets.FIGMA_CLIENT_SECRET }}
            FIGMA_CALLBACK_URL=${{ secrets.FIGMA_CALLBACK_URL }}
            NOTION_CLIENT_ID=${{ secrets.NOTION_CLIENT_ID }}
            NOTION_CLIENT_SECRET=${{ secrets.NOTION_CLIENT_SECRET }}
            NOTION_CALLBACK_URL=${{ secrets.NOTION_CALLBACK_URL }}
            NOTION_WEBHOOK_VERIFICATION_TOKEN=${{ secrets.NOTION_WEBHOOK_VERIFICATION_TOKEN }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}
            KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
            KAKAO_REDIRECT_URI=${{ secrets.KAKAO_REDIRECT_URI || 'https://umc-plog.site/oauth/kakao' }}
            SOCIAL_GOOGLE_CLIENT_ID=${{ secrets.SOCIAL_GOOGLE_CLIENT_ID }}
            SOCIAL_GOOGLE_CLIENT_SECRET=${{ secrets.SOCIAL_GOOGLE_CLIENT_SECRET }}
            SOCIAL_GOOGLE_REDIRECT_URI=${{ secrets.SOCIAL_GOOGLE_REDIRECT_URI || 'https://umc-plog.site/oauth/google' }}
            FCM_ENABLED=true
            REPORT_SCHEDULER_ENABLED=true
            FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
            GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/firebase-service-account.json
            LLM_PROVIDER=gemini
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GEMINI_MODEL=gemini-2.5-flash
            EMBEDDING_MODEL=gemini-embedding-001
            EOF
            chmod 600 .env

            # 시크릿 누락은 빈 값으로 조용히 통과한다 → 컨테이너 띄우기 전에 여기서 끊는다.
            for required in DB_URL DB_USERNAME DB_PASSWORD JWT_SECRET MAIL_USERNAME \
                            MAIL_PASSWORD INVITE_TOKEN_ENCRYPTION_KEY_BASE64 INVITE_BASE_URL \
                            FIREBASE_PROJECT_ID; do
              if ! grep -q "^${required}=." .env; then
                echo "❌ 필수 시크릿이 비어 있습니다: ${required}"
                exit 1
              fi
            done

            firebase_service_account_base64='${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}'
            if [ -z "${firebase_service_account_base64}" ]; then
              echo "❌ 필수 시크릿이 비어 있습니다: FIREBASE_SERVICE_ACCOUNT_JSON_BASE64"
              exit 1
            fi

            mkdir -p .secrets
            chmod 700 .secrets
            printf '%s' "${firebase_service_account_base64}" \
              | base64 --decode > .secrets/firebase-service-account.json.next
            unset firebase_service_account_base64
            if [ ! -s .secrets/firebase-service-account.json.next ]; then
              echo "❌ Firebase 서비스 계정 파일 복원에 실패했습니다."
              exit 1
            fi
            chmod 600 .secrets/firebase-service-account.json.next
            mv .secrets/firebase-service-account.json.next .secrets/firebase-service-account.json

            # 연동 값은 없어도 앱이 기동한다 → 조용히 죽는 대신 경고만 남긴다.
            # (비어 있으면 해당 provider 연동 API 만 PROVIDER_CONFIGURATION_ERROR 로 실패한다)
            for optional in INTEGRATION_CREDENTIAL_ENCRYPTION_KEY_BASE64 \
                            GITHUB_APP_ID GITHUB_APP_SLUG GITHUB_APP_PRIVATE_KEY_BASE64 \
                            FIGMA_CLIENT_ID FIGMA_CLIENT_SECRET \
                            NOTION_CLIENT_ID NOTION_CLIENT_SECRET NOTION_WEBHOOK_VERIFICATION_TOKEN \
                            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
                            KAKAO_CLIENT_ID KAKAO_CLIENT_SECRET \
                            SOCIAL_GOOGLE_CLIENT_ID SOCIAL_GOOGLE_CLIENT_SECRET \
              if ! grep -q "^${optional}=." .env; then
                echo "⚠️ 연동 설정이 비어 있습니다(해당 provider 연동 비활성): ${optional}"
              fi
            done

            # private 이미지 pull 위해 EC2 도 Docker Hub 로그인
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker compose pull
            docker compose config --quiet
            docker compose up -d
            docker image prune -f

            # 기동 확인 (최대 60초 대기)
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8080/swagger-ui/index.html > /dev/null; then
                echo "✅ 배포 성공: 앱이 응답합니다."
                exit 0
              fi
              echo "기동 대기 중... ($i/12)"
              sleep 5
            done
            echo "⚠️ 앱이 60초 내 응답하지 않음. 로그 확인:"
            docker compose logs --tail=50
            exit 1
