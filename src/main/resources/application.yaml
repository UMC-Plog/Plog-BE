spring:
  application:
    name: plog
  # @Scheduled 전용 스레드풀. 기본값이 1이라 앱의 모든 배치가 한 스레드를 공유한다.
  # UploadedFileTagScheduler.retryTagging 은 한 틱에 최대 400회(원본+썸네일) 블로킹 S3
  # 호출을 하는데, 그 옆에서 ThumbnailScheduler.confirmReady 가 3초마다 돌아야 한다.
  # 1이면 태깅 배치가 밀리는 동안 썸네일 확인이 통째로 멈춰 프론트 스켈레톤이 길어진다.
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          # 저장 기준(TimeUtil.STORAGE_ZONE)은 KST지만 이 설정은 UTC로 둔다.
          # 이 값은 LocalDateTime 바인딩에는 관여하지 않고 Instant 계열만 관장하는데,
          # Instant 컬럼(integration 도메인)은 절대시각이라 UTC로 다루는 것이 맞다.
          time_zone: UTC
  # Gmail SMTP. 계정/앱비밀번호는 literal 금지 → 환경변수로만 주입
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # 응답 지연 대비 타임아웃(ms) — 메일 서버가 늘어질 때 스레드 물고 있지 않도록
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# 애플리케이션 커스텀 프로퍼티 (@ConfigurationProperties 로 바인딩)
app:
  jwt:
    # 기본값 금지: 누락 시 조용히 약한 키로 뜨는 것보다 기동 실패가 낫다.
    # HS256이면 최소 256비트(UTF-8 32바이트 이상) 필요 — JwtProperties에서 검증
    secret: ${JWT_SECRET}
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    # 이미지 표시용 미디어 쿠키 수명. refresh 와 같은 값이어야 "로그인 세션이 살아 있으면
    # 미디어 쿠키도 살아 있다"가 불변식으로 성립한다.
    media-token-ttl: 14d
    # 회전 유예. 이 시간 안에 같은 리프레시 토큰이 다시 오면 재시도로 보고 통과시킨다.
    # 없으면 JwtProperties 가 기동을 막는다 — 유예 0은 재발급이 한 번만 겹쳐도
    # 로그아웃되던 예전 동작이라, 조용히 기본값으로 돌아가지 않게 필수값으로 뒀다.
    refresh-token-grace: 60s
  # 이메일 인증 코드 정책 (하드코딩 금지 → @ConfigurationProperties 바인딩)
  email-verification:
    code-length: 6
    ttl: 5m
    max-attempts: 5
    resend-cooldown: 60s
  # 탈퇴 후 개인정보 파기까지의 유예 기간. 화면 안내 문구("7일 후 완전히 삭제")와 같은 값이어야 한다.
  withdrawal:
    retention: 7d
  # 소셜 가입 티켓 수명. 약관 동의 → 프로필 설정을 마치기에 충분해야 한다.
  social-signup:
    ticket-ttl: 30m
  # 응답에 절대 URL 을 담을 때 쓰는 이 API 의 공개 오리진 (채팅·게시글·업무카드 공용)
  base-url: http://localhost:8080
  # 채팅 미디어 쿠키 전용 설정
  media:
    cookie-same-site: None
  # CORS 허용 오리진. 환경별로 다르므로 프로퍼티로 관리 (배포 도메인은 확정 후 추가)
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - https://umc-plog.site

plog:
  # 통합 테스트처럼 스케줄러를 호출자가 직접 구동하는 환경에서는 전체 @Scheduled 등록을 끈다.
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
  invite:
    # 32바이트 AES 키를 Base64로 인코딩한 값. 누락 시 애플리케이션 시작을 중단한다.
    encryption-key-base64: ${INVITE_TOKEN_ENCRYPTION_KEY_BASE64}
    base-url: ${INVITE_BASE_URL}
  # 소셜 로그인 자격증명. plog.integration.google(Drive 연동용)과 별개의 OAuth 클라이언트다.
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/kakao}
    google:
      client-id: ${SOCIAL_GOOGLE_CLIENT_ID:}
      client-secret: ${SOCIAL_GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${SOCIAL_GOOGLE_REDIRECT_URI:http://localhost:5173/oauth/google}
  integration:
    # OAuth 토큰은 AES-GCM으로 암호화해 저장한다. 실제 provider 연결 전에는 비워둘 수 있다.
    encryption-key-base64: ${INTEGRATION_CREDENTIAL_ENCRYPTION_KEY_BASE64:}
    redirect:
      success-url: ${INTEGRATION_SUCCESS_REDIRECT_URL:http://localhost:5173/integrations/callback}
      failure-url: ${INTEGRATION_FAILURE_REDIRECT_URL:http://localhost:5173/integrations/callback}
    # 수집 1건은 GitHub 리포지토리 하나당 수백 회의 API 호출이 필요해 수 분이 걸린다.
    # HTTP 요청 스레드에서 처리하면 ALB 타임아웃에 끊기고, 끊긴 뒤에도 서버는 계속 호출해
    # rate limit만 태운다. 그래서 DB 큐 + @Scheduled 워커로 돌린다.
    collection:
      poll-delay-ms: 5000
      batch-size: 5
      # heartbeat가 이 시간 넘게 끊기면 재배포 등으로 죽은 잡으로 보고 회수한다.
      processing-timeout: 30m
      max-attempts: 5
      # 항목 이 개수마다 커서를 저장한다. 작을수록 재개가 정확하지만 DB 쓰기가 늘어난다.
      cursor-flush-interval: 25
      # 워터마크에서 이만큼 앞당겨 수집한다. 시계 오차와 provider 반영 지연을 흡수한다.
      # 겹쳐 가져와도 activity 저장이 멱등이라 안전하다.
      watermark-overlap: 1h
      github-min-interval-ms: 100
      # 남은 rate limit이 이 아래로 떨어지면 잡을 중단하고 reset 이후로 재큐한다.
      rate-limit-min-remaining: 100
    github:
      app-id: ${GITHUB_APP_ID:}
      app-slug: ${GITHUB_APP_SLUG:}
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      private-key-base64: ${GITHUB_APP_PRIVATE_KEY_BASE64:}
    figma:
      client-id: ${FIGMA_CLIENT_ID:}
      client-secret: ${FIGMA_CLIENT_SECRET:}
      callback-url: ${FIGMA_CALLBACK_URL:http://localhost:8080/api/integrations/figma/callback}
    notion:
      client-id: ${NOTION_CLIENT_ID:}
      client-secret: ${NOTION_CLIENT_SECRET:}
      callback-url: ${NOTION_CALLBACK_URL:http://localhost:8080/api/integrations/notion/callback}
      webhook:
        # Notion 구독 인증 요청에서 받은 값을 배포 환경변수로 주입한다.
        verification-token: ${NOTION_WEBHOOK_VERIFICATION_TOKEN:}
        debounce: 3m
        processing-timeout: 30m
        max-attempts: 5
        poll-delay-ms: 10000
        batch-size: 10
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      callback-url: ${GOOGLE_CALLBACK_URL:http://localhost:8080/api/integrations/google/callback}
  # S3 인프라가 준비되기 전까지 비활성화한다. 활성화 시 bucket과 AWS 자격증명이 필요하다.
  s3:
    enabled: ${S3_ENABLED:false}
    bucket: ${S3_BUCKET:umc-plog-prod}
    region: ${S3_REGION:ap-northeast-2}
    endpoint: ${S3_ENDPOINT:}
  # 채팅 이미지 썸네일 파이프라인.
  # 여기 false 는 "환경변수가 없을 때"의 기본값이고, 로컬에는 AWS 가 없으므로 꺼 둔다.
  # 운영은 cd.yml 이 THUMBNAIL_ENABLED=true 를 주입해 켠다(S3_ENABLED 와 같은 구조).
  #
  # uploaded_file 의 썸네일 컬럼 DDL 은 이 플래그와 <무관하게> 배포 전에 적용해야 한다.
  # 엔티티 매핑이 이미 바뀌어서, 컬럼이 없으면 ddl-auto:update 가 NOT NULL 컬럼 추가에
  # 실패하고 uploaded_file 관련 쿼리가 전부 깨진다.
  thumbnail:
    enabled: ${THUMBNAIL_ENABLED:false}
    function-name: ${THUMBNAIL_FUNCTION_NAME:plog-thumbnail}
    max-edge: 640
  # 리포트 텍스트 생성 LLM.
  #
  # 기본값이 stub 인 이유: 팀원 로컬과 CI 에는 키가 없고, 그 환경에서도 앱은 떠야 한다.
  # provider=gemini 라도 키가 비면 기동에 실패하지 않고 Stub 으로 폴백한다(기동 로그에 WARN).
  #
  # SDK 대신 RestClient + API 키 헤더를 쓴다. 컨테이너에 Firebase 용
  # GOOGLE_APPLICATION_CREDENTIALS 가 이미 있어서, ADC 를 자동으로 집는 SDK 는
  # Firebase 서비스 계정으로 인증을 시도한다.
  llm:
    provider: ${LLM_PROVIDER:stub}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    connect-timeout: 5s
    read-timeout: 60s
    max-output-tokens: 2048
    temperature: 0.3

  # 리포트 파이프라인 3단계(임베딩 생성) 클라이언트.
  #
  # Gemini API의 gemini-embedding-001을 쓴다. LLM과 같은 GEMINI_API_KEY, 같은 인증 방식
  # (x-goog-api-key 헤더)이라 별도 시크릿이 필요 없다. 원래 Ollama 자체 호스팅(EC2 Docker
  # 컨테이너)을 검토했으나, 운영 EC2가 t3.micro(1GB RAM) 프리티어라 Ollama+모델을 얹으면
  # 기존 서비스와 메모리를 다퉈 OOM 위험이 있어 외부 API 호출 방식으로 전환했다 — EC2
  # 리소스를 전혀 안 쓴다. (Ollama 클라이언트 코드는 남겨뒀다 — ollama.* 설정을 채우면
  # Gemini 키가 없을 때 자동으로 그쪽을 쓴다. EmbeddingClientConfig 참고.)
  #
  # 기본값이 stub 인 이유는 LLM과 같다: 팀원 로컬과 CI 에는 키가 없고, 그 환경에서도
  # 앱은 떠야 한다. gemini.api-key/model이 비면 기동에 실패하지 않고 Stub 으로 폴백한다
  # (기동 로그에 WARN). 운영 배포는 cd.yml이 GEMINI_API_KEY를 필수 시크릿으로 검증해서
  # Stub이 운영에 올라가는 상황 자체를 배포 단계에서 막는다.
  embedding:
    # 프로바이더별 설정을 완전히 분리해뒀다 — EmbeddingClientConfig가 "Gemini 되면 Gemini,
    # 안 되면 Ollama, 그것도 안 되면 Stub" 순서로 각자 독립적인 가용성만 보고 선택한다.
    gemini:
      api-key: ${GEMINI_API_KEY:}
      base-url: ${EMBEDDING_BASE_URL:https://generativelanguage.googleapis.com}
      model: ${EMBEDDING_MODEL:gemini-embedding-001}
    # 기본값을 비워둔다 — localhost 같은 그럴듯한 기본값을 주면 운영에서 아무도 설정
    # 안 했는데도 "설정된 것처럼" 보여서 위험하다. 자체 호스팅 여유가 생기면 두 값을
    # 명시적으로 채워서 재사용한다(EMBEDDING_OLLAMA_BASE_URL/EMBEDDING_OLLAMA_MODEL).
    ollama:
      base-url: ${EMBEDDING_OLLAMA_BASE_URL:}
      model: ${EMBEDDING_OLLAMA_MODEL:}
    connect-timeout: 5s
    read-timeout: 30s
    dimension: 3072

  # 평가 유예(마감일 +7일)가 끝난 프로젝트의 리포트를 자동으로 시작하는 배치.
  #
  # 기본값 false는 마감+유예기간 기반 정기 생성만 운영에서 명시적으로 켜기 위한 것이다.
  # Peer 평가 완료 경로는 이 플래그와 무관하게 즉시 생성되며, 생성 직전 준비 barrier가
  # 정제·임베딩·분류를 직접 비우므로 아래 세 처리 스케줄러가 꺼져 있어도 불완전한 입력을 발행하지 않는다.
  #
  # 끈 상태에서도 ReportBatchService.startDueReports() 는 살아 있다(스케줄러 빈만 사라진다) —
  # 통합 테스트는 그 메서드를 직접 호출해서 검증한다.
  report:
    activity:
      # 내부 활동은 프로젝트 마감 후 원본 데이터에서 일괄 수집한다.
      realtime-collection:
        enabled: ${REPORT_REALTIME_ACTIVITY_COLLECTION_ENABLED:false}
    pdf:
      render-base-url: ${REPORT_PDF_RENDER_BASE_URL}
      timeout: ${REPORT_PDF_RENDER_TIMEOUT:45s}
      recovery-delay-ms: ${REPORT_PDF_RECOVERY_DELAY_MS:3600000}
    scheduler:
      enabled: ${REPORT_SCHEDULER_ENABLED:false}
      # 초 분 시 일 월 요일 (Spring 6필드). 컨테이너 TZ=Asia/Seoul 기준.
      cron: ${REPORT_SCHEDULER_CRON:0 40 3 * * *}
    # 리포트 파이프라인 1단계(Rule 기반 정제) 배치.
    # 계속 돌며 밀려있는 미정제 행을 조금씩 비워나가는 구조라 IntegrationCollectionJobWorker와 같이
    # poll-delay-ms 기반 fixedDelay로 돈다(cron이 아니다).
    # 임베딩 대상 쿼리(selectClaimableEmbeddingActivities)가 noise_filtered=false인 행만 조회하므로,
    # 이 정제 배치가 늦어져도 임베딩 배치가 잘못된 행을 집어가는 일은 없다
    # (단순히 처리할 게 없어 0건으로 끝난다). 그래도 정제가 먼저 끝나야 임베딩이 바로 이어받으므로
    # 정제 주기를 임베딩보다 짧게(기본 30초) 잡고, 외부 API 호출이 섞인 임베딩은 더 여유있게(기본 60초) 잡는다.
    refinement:
      enabled: ${REPORT_REFINEMENT_SCHEDULER_ENABLED:false}
      poll-delay-ms: ${REPORT_REFINEMENT_POLL_DELAY_MS:30000}
    # 리포트 파이프라인 3단계(임베딩 생성) 배치.
    embedding:
      enabled: ${REPORT_EMBEDDING_SCHEDULER_ENABLED:false}
      poll-delay-ms: ${REPORT_EMBEDDING_POLL_DELAY_MS:60000}
    # 리포트 파이프라인 2단계(활동 유형 분류) 배치. 3단계(임베딩) 뒤에 실행되지만, 조회 조건이
    # embedding_model IS NOT NULL이라 순서가 뒤바뀌어 돌아도 안전하다(정제/임베딩과 동일한 이유).
    # anchor 임계값(0.5)이 실측 데이터로 검증되지 않아 refinement/embedding과 같이 기본값은 꺼짐.
    classification:
      enabled: ${REPORT_CLASSIFICATION_SCHEDULER_ENABLED:false}
      poll-delay-ms: ${REPORT_CLASSIFICATION_POLL_DELAY_MS:30000}

  notification:
    peer-evaluation:
      # 마감 프로젝트의 내부 후처리와 외부 최종 수집을 시작한다. 연동 프로젝트의 평가는
      # 외부 수집이 종료 상태에 도달한 뒤 열리며, 이 스케줄러가 직접 알림을 발송하지 않는다.
      cron: ${PEER_EVALUATION_NOTIFICATION_CRON:0 0 0 * * *}
  # 운영 환경에서만 활성화하며 인증은 Application Default Credentials를 사용한다.
  fcm:
    enabled: ${FCM_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
