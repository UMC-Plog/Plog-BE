spring:
  application:
    name: plog
  # @Scheduled 전용 스레드풀. 기본값이 1이라 앱의 모든 배치가 한 스레드를 공유한다.
  # UploadedFileTagScheduler.retryTagging 은 한 틱에 최대 400회(원본+썸네일) 블로킹 S3
  # 호출을 하는데, 그 옆에서 ThumbnailScheduler.confirmReady 가 3초마다 돌아야 한다.
  # 1이면 태깅 배치가 밀리는 동안 썸네일 확인이 통째로 멈춰 프론트 스켈레톤이 길어진다.
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: ${LOCAL_DB_URL}
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  # Gmail SMTP. 계정/앱비밀번호는 literal 금지 → 환경변수로만 주입
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # 응답 지연 대비 타임아웃(ms) — 메일 서버가 늘어질 때 스레드 물고 있지 않도록
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# 애플리케이션 커스텀 프로퍼티 (@ConfigurationProperties 로 바인딩)
app:
  jwt:
    # 기본값 금지: 누락 시 조용히 약한 키로 뜨는 것보다 기동 실패가 낫다.
    # HS256이면 최소 256비트(UTF-8 32바이트 이상) 필요 — JwtProperties에서 검증
    secret: ${JWT_SECRET}
    access-token-ttl: 30m
    refresh-token-ttl: 14d
    # 이미지 표시용 미디어 쿠키 수명. refresh 와 같은 값이어야 "로그인 세션이 살아 있으면
    # 미디어 쿠키도 살아 있다"가 불변식으로 성립한다.
    media-token-ttl: 14d
  # 이메일 인증 코드 정책 (하드코딩 금지 → @ConfigurationProperties 바인딩)
  email-verification:
    code-length: 6
    ttl: 5m
    max-attempts: 5
    resend-cooldown: 60s
  # 탈퇴 후 개인정보 파기까지의 유예 기간. 화면 안내 문구("7일 후 완전히 삭제")와 같은 값이어야 한다.
  withdrawal:
    retention: 7d
  # 소셜 가입 티켓 수명. 약관 동의 → 프로필 설정을 마치기에 충분해야 한다.
  social-signup:
    ticket-ttl: 30m
  # 응답에 절대 URL 을 담을 때 쓰는 이 API 의 공개 오리진 (채팅·게시글·업무카드 공용)
  base-url: http://localhost:8080
  # 채팅 미디어 쿠키 전용 설정
  media:
    cookie-same-site: None
  # CORS 허용 오리진. 환경별로 다르므로 프로퍼티로 관리 (배포 도메인은 확정 후 추가)
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - https://umc-plog.site

plog:
  invite:
    # 32바이트 AES 키를 Base64로 인코딩한 값. 누락 시 애플리케이션 시작을 중단한다.
    encryption-key-base64: ${INVITE_TOKEN_ENCRYPTION_KEY_BASE64}
    base-url: ${INVITE_BASE_URL}
  # 소셜 로그인 자격증명. plog.integration.google(Drive 연동용)과 별개의 OAuth 클라이언트다.
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/kakao}
    google:
      client-id: ${SOCIAL_GOOGLE_CLIENT_ID:}
      client-secret: ${SOCIAL_GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${SOCIAL_GOOGLE_REDIRECT_URI:http://localhost:5173/oauth/google}
  integration:
    # OAuth 토큰은 AES-GCM으로 암호화해 저장한다. 실제 provider 연결 전에는 비워둘 수 있다.
    encryption-key-base64: ${INTEGRATION_CREDENTIAL_ENCRYPTION_KEY_BASE64:}
    redirect:
      success-url: ${INTEGRATION_SUCCESS_REDIRECT_URL:http://localhost:5173/integrations/callback}
      failure-url: ${INTEGRATION_FAILURE_REDIRECT_URL:http://localhost:5173/integrations/callback}
    # 수집 1건은 GitHub 리포지토리 하나당 수백 회의 API 호출이 필요해 수 분이 걸린다.
    # HTTP 요청 스레드에서 처리하면 ALB 타임아웃에 끊기고, 끊긴 뒤에도 서버는 계속 호출해
    # rate limit만 태운다. 그래서 DB 큐 + @Scheduled 워커로 돌린다.
    collection:
      poll-delay-ms: 5000
      batch-size: 5
      # heartbeat가 이 시간 넘게 끊기면 재배포 등으로 죽은 잡으로 보고 회수한다.
      processing-timeout: 30m
      max-attempts: 5
      # 항목 이 개수마다 커서를 저장한다. 작을수록 재개가 정확하지만 DB 쓰기가 늘어난다.
      cursor-flush-interval: 25
      # 워터마크에서 이만큼 앞당겨 수집한다. 시계 오차와 provider 반영 지연을 흡수한다.
      # 겹쳐 가져와도 activity 저장이 멱등이라 안전하다.
      watermark-overlap: 1h
      github-min-interval-ms: 100
      # 남은 rate limit이 이 아래로 떨어지면 잡을 중단하고 reset 이후로 재큐한다.
      rate-limit-min-remaining: 100
    github:
      app-id: ${GITHUB_APP_ID:}
      app-slug: ${GITHUB_APP_SLUG:}
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      private-key-base64: ${GITHUB_APP_PRIVATE_KEY_BASE64:}
    figma:
      client-id: ${FIGMA_CLIENT_ID:}
      client-secret: ${FIGMA_CLIENT_SECRET:}
      callback-url: ${FIGMA_CALLBACK_URL:http://localhost:8080/api/integrations/figma/callback}
    notion:
      client-id: ${NOTION_CLIENT_ID:}
      client-secret: ${NOTION_CLIENT_SECRET:}
      callback-url: ${NOTION_CALLBACK_URL:http://localhost:8080/api/integrations/notion/callback}
      webhook:
        # Notion 구독 인증 요청에서 받은 값을 배포 환경변수로 주입한다.
        verification-token: ${NOTION_WEBHOOK_VERIFICATION_TOKEN:}
        debounce: 3m
        processing-timeout: 30m
        max-attempts: 5
        poll-delay-ms: 10000
        batch-size: 10
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      callback-url: ${GOOGLE_CALLBACK_URL:http://localhost:8080/api/integrations/google/callback}
  # S3 인프라가 준비되기 전까지 비활성화한다. 활성화 시 bucket과 AWS 자격증명이 필요하다.
  s3:
    enabled: ${S3_ENABLED:false}
    bucket: ${S3_BUCKET:umc-plog-prod}
    region: ${S3_REGION:ap-northeast-2}
    endpoint: ${S3_ENDPOINT:}
  # 채팅 이미지 썸네일 파이프라인.
  # 여기 false 는 "환경변수가 없을 때"의 기본값이고, 로컬에는 AWS 가 없으므로 꺼 둔다.
  # 운영은 cd.yml 이 THUMBNAIL_ENABLED=true 를 주입해 켠다(S3_ENABLED 와 같은 구조).
  #
  # uploaded_file 의 썸네일 컬럼 DDL 은 이 플래그와 <무관하게> 배포 전에 적용해야 한다.
  # 엔티티 매핑이 이미 바뀌어서, 컬럼이 없으면 ddl-auto:update 가 NOT NULL 컬럼 추가에
  # 실패하고 uploaded_file 관련 쿼리가 전부 깨진다.
  thumbnail:
    enabled: ${THUMBNAIL_ENABLED:false}
    function-name: ${THUMBNAIL_FUNCTION_NAME:plog-thumbnail}
    max-edge: 640
  # 리포트 텍스트 생성 LLM.
  #
  # 기본값이 stub 인 이유: 팀원 로컬과 CI 에는 키가 없고, 그 환경에서도 앱은 떠야 한다.
  # provider=gemini 라도 키가 비면 기동에 실패하지 않고 Stub 으로 폴백한다(기동 로그에 WARN).
  #
  # SDK 대신 RestClient + API 키 헤더를 쓴다. 컨테이너에 Firebase 용
  # GOOGLE_APPLICATION_CREDENTIALS 가 이미 있어서, ADC 를 자동으로 집는 SDK 는
  # Firebase 서비스 계정으로 인증을 시도한다.
  llm:
    provider: ${LLM_PROVIDER:stub}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    connect-timeout: 5s
    # 다른 외부 연동(10초)보다 길다 — LLM 응답은 수 초에서 수십 초까지 걸린다.
    read-timeout: 60s
    max-output-tokens: 2048
    # 평가 문장은 재현성이 중요해 낮게 둔다.
    temperature: 0.3
  # 평가 유예(마감일 +7일)가 끝난 프로젝트의 리포트를 자동으로 시작하는 배치.
  #
  # 기본값 false 인 이유는 thumbnail 과 다르다. 여기는 인프라가 없어서가 아니라 <파이프라인이
  # 아직 미완성>이라서다 — 지금 켜면 GENERATING 으로만 남는 리포트가 매일 쌓인다.
  # LLM 생성·발행까지 끝난 뒤 cd.yml 에 REPORT_SCHEDULER_ENABLED=true 를 넣어 켠다.
  #
  # 끈 상태에서도 ReportBatchService.startDueReports() 는 살아 있다(스케줄러 빈만 사라진다) —
  # 통합 테스트는 그 메서드를 직접 호출해서 검증한다.
  report:
    scheduler:
      enabled: ${REPORT_SCHEDULER_ENABLED:false}
      # 초 분 시 일 월 요일 (Spring 6필드). 컨테이너 TZ=UTC 기준.
      cron: ${REPORT_SCHEDULER_CRON:0 40 3 * * *}
  notification:
    peer-evaluation:
      # 프로젝트 종료일 당일 00:00 UTC부터 평가가 열리므로 매일 경계 시점에 확인한다.
      cron: ${PEER_EVALUATION_NOTIFICATION_CRON:0 0 0 * * *}
  # 운영 환경에서만 활성화하며 인증은 Application Default Credentials를 사용한다.
  fcm:
    enabled: ${FCM_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
